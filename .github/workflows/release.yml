name: release

on:
  push:
    tags:
      - "v*"

# Lecture par defaut. Seul le job `release` obtient `contents: write`.
permissions:
  contents: read

# Pas de cancel-in-progress ici : une release a moitie publiee coute plus cher
# qu'un run redondant.

env:
  RUST_VERSION: "1.98.1"
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: tag == version Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tag_version="${tag#v}"
          # awk plutot que `cargo metadata` : pas de toolchain ni de fetch des
          # dependances git pour lire un champ du manifeste.
          manifest_version="$(awk '
            /^\[package\]/ { pkg = 1; next }
            /^\[/          { pkg = 0 }
            pkg && /^version[[:space:]]*=/ {
              gsub(/^version[[:space:]]*=[[:space:]]*"|"[[:space:]]*$/, "")
              print; exit
            }' Cargo.toml)"
          echo "tag            ${tag}"
          echo "tag_version    ${tag_version}"
          echo "Cargo.toml     ${manifest_version}"
          if [ -z "${manifest_version}" ]; then
            echo "::error::aucun champ version dans le bloc [package] de Cargo.toml"
            exit 1
          fi
          if [ "${tag_version}" != "${manifest_version}" ]; then
            echo "::error::desaccord de version : tag ${tag} porte ${tag_version}, Cargo.toml porte ${manifest_version}. Aligne Cargo.toml puis retague ; aucune archive et aucune release ne sont produites."
            exit 1
          fi
          echo "version=${manifest_version}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: guard
    strategy:
      # Une release partielle n'a pas d'interet : si une cible tombe, on arrete.
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            exe: ""
            sha256: shasum -a 256
          - target: x86_64-apple-darwin
            os: macos-15-intel
            exe: ""
            sha256: shasum -a 256
          # Linux epingle sur 24.04 : ubuntu-latest suivra Ubuntu 26 et
          # relevera sans prevenir la glibc minimale exigee par le binaire.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            exe: ""
            sha256: sha256sum
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            exe: ""
            sha256: sha256sum
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
            sha256: sha256sum
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            exe: .exe
            sha256: sha256sum
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      STEM: drakkar-v${{ needs.guard.outputs.version }}-${{ matrix.target }}
    steps:
      # Avant le checkout : un Cargo.lock passe en CRLF fausserait les revs
      # extraits par build-info.
      - name: fins de ligne LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-key: release-${{ matrix.target }}
          target: ${{ matrix.target }}

      - name: cargo build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "${TARGET}"

      - uses: ./.github/actions/build-info
        with:
          dest: dist/${{ env.STEM }}.BUILD-INFO.txt
          target: ${{ matrix.target }}
          version: ${{ needs.guard.outputs.version }}

      - name: binaire et sommes
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          bin="${STEM}${EXE}"
          cp "target/${TARGET}/release/drakkar${EXE}" "dist/${bin}"
          read -r -a sum <<< "${SHA256}"
          # SHA-256 en entier, jamais tronque. Format `sha256sum -c`.
          cd dist
          for f in "${bin}" "${STEM}.BUILD-INFO.txt"; do
            "${sum[@]}" "${f}" | tee "${f}.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

  release:
    name: github release
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pas de checkout : `gh release create --repo` n'en a pas besoin.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # sha256sum sous Git Bash peut ecrire `<somme> *<fichier>` (mode
          # binaire) : toutes les lignes sont ramenees a `<somme>  <fichier>`.
          cat ./*.sha256 \
            | tr -d '\r' \
            | sed -E 's/^([0-9a-f]{64}) [ *]/\1  /' \
            | LC_ALL=C sort -k2 > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS
          # Six cibles, deux fichiers chacune : le binaire et son BUILD-INFO.txt.
          published=(drakkar-v*)
          sums="$(wc -l < SHA256SUMS)"
          if [ "${#published[@]}" -ne 12 ] || [ "${sums}" -ne 12 ]; then
            echo "::error::attendu 12 fichiers drakkar-v* et 12 sommes, obtenu ${#published[@]} fichiers et ${sums} sommes"
            exit 1
          fi

      - name: notes
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/notes.md" <<'EOF'
          Binaires construits par la CI, un runner natif par cible, feature `lief-backend` non activee. Chaque asset est l'executable lui-meme : aucune archive.

          | Cible | Binaire |
          |---|---|
          | `aarch64-apple-darwin` (macOS Apple Silicon) | `drakkar-v@VERSION@-aarch64-apple-darwin` |
          | `x86_64-apple-darwin` (macOS Intel) | `drakkar-v@VERSION@-x86_64-apple-darwin` |
          | `x86_64-unknown-linux-gnu` (Linux x86_64) | `drakkar-v@VERSION@-x86_64-unknown-linux-gnu` |
          | `aarch64-unknown-linux-gnu` (Linux ARM64) | `drakkar-v@VERSION@-aarch64-unknown-linux-gnu` |
          | `x86_64-pc-windows-msvc` (Windows x64) | `drakkar-v@VERSION@-x86_64-pc-windows-msvc.exe` |
          | `aarch64-pc-windows-msvc` (Windows ARM64) | `drakkar-v@VERSION@-aarch64-pc-windows-msvc.exe` |

          `SHA256SUMS` porte la somme SHA-256 complete de chaque binaire et de chaque `BUILD-INFO.txt`. Telecharger le binaire voulu et `SHA256SUMS` dans le meme repertoire, puis :

          Linux :

          ```sh
          sha256sum -c --ignore-missing SHA256SUMS
          chmod +x drakkar-v@VERSION@-<cible>
          ```

          macOS (binaire non signe, non notarise) :

          ```sh
          shasum -a 256 -c --ignore-missing SHA256SUMS
          chmod +x drakkar-v@VERSION@-<cible>
          xattr -d com.apple.quarantine drakkar-v@VERSION@-<cible>
          ```

          Windows (PowerShell) : comparer la somme affichee a la ligne du binaire dans `SHA256SUMS` (Get-FileHash l'ecrit en majuscules, la casse est indifferente).

          ```powershell
          Get-FileHash -Algorithm SHA256 drakkar-v@VERSION@-<cible>.exe
          ```

          Chaque binaire a son `drakkar-v@VERSION@-<cible>.BUILD-INFO.txt` : commit complet, version de rustc, et rev complet de toutes les dependances git de `Cargo.lock`.
          EOF
          sed -i "s/@VERSION@/${VERSION}/g" "${RUNNER_TEMP}/notes.md"

      - name: publier
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "drakkar ${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            dist/SHA256SUMS \
            dist/drakkar-v*
