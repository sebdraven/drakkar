name: rust-setup
description: Toolchain Rust epinglee + cache cargo (registre, depots git, target).

inputs:
  toolchain:
    description: Version stable exacte, jamais `stable` flottant.
    required: true
  cache-key:
    description: Discriminant de cache, un par profil de build (fmt, clippy, test, release).
    required: true
  target:
    description: Triplet a construire. Doit etre l'hote de la toolchain, aucune compilation croisee. Vide = hote, sans controle.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # rustup est preinstalle sur les runners GitHub : pas d'action tierce, donc
    # pas de runtime Node a surveiller sur cette etape.
    - name: toolchain
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install "${{ inputs.toolchain }}" \
          --profile minimal \
          --no-self-update
        rustup component add rustfmt clippy --toolchain "${{ inputs.toolchain }}"
        rustup default "${{ inputs.toolchain }}"
        rustc --version --verbose
        cargo --version

    # zstd-sys, bzip2-sys et lzma-sys compilent du C : seule une toolchain
    # native au runner est admise.
    - name: cible native
      if: inputs.target != ''
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        host="$(rustc --version --verbose | tr -d '\r' | sed -n 's/^host: //p')"
        if [ "${host}" != "${TARGET}" ]; then
          echo "::error::toolchain hote ${host}, cible ${TARGET} : ce serait une compilation croisee"
          exit 1
        fi
        rustup target add "${TARGET}" --toolchain "${{ inputs.toolchain }}"

    - name: cache cargo
      uses: actions/cache@v5
      with:
        # registry/src et git/checkouts sont regeneres depuis registry/cache et
        # git/db : les cacher doublerait le volume pour rien.
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        # Cargo.lock porte le rev exact de chaque dependance git. Un bump de rev
        # change le hash, donc change la cle : aucun cache perime ne peut etre
        # servi. runner.os + runner.arch distinguent deja les six cibles de
        # release ; cache-key porte en plus le triplet.
        # Pas de restore-keys, volontairement : un repli qui ignore le lock
        # reintroduirait exactement ce risque.
        key: cargo-${{ runner.os }}-${{ runner.arch }}-rust${{ inputs.toolchain }}-${{ inputs.cache-key }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
