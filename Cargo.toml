[package]
name = "drakkar"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Static MITRE ATT&CK for Mobile detection on Android APKs via inter-procedural CFG"
authors = ["Sebastien Larinier"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
petgraph = { version = "0.6", features = ["serde-1"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# DEX parsing structurel : classes -> methods -> code_item. Apache-2.0,
# compatible en aval avec l'AGPL-3.0-or-later de Drakkar. Le paquet vit dans le
# sous-répertoire dexparser-rs/ du dépôt, qui n'a pas de Cargo.toml à sa racine.
# Consommé UNIQUEMENT par parser::dex_facade.
#
# ⚠️ `branch = "main"` : c'est la forme exacte que déclare dex-decompiler.
# Toute autre forme donnerait un SourceId distinct, donc DEUX paquets
# dex-parser dans le graphe et deux `DexFile` non interchangeables.
dex-parser = { git = "https://github.com/androguard/dex-parser", branch = "main" }

# Lecture de l'archive APK (zip) pour extraire classes*.dex et lib/*/*.so
zip = "2"
tempfile = "3"

# Décompression deflate brute, utilisée par le lecteur ZIP tolérant
# (src/parser/apkzip.rs) quand le crate `zip` refuse une archive trafiquée.
flate2 = "1"

# Mode bulk : parallélisme de l'analyse d'un répertoire d'APK.
rayon = "1"
# Parcours récursif optionnel du répertoire d'APK en mode bulk.
walkdir = "2"

# Décodage du manifest binaire (AXML) : permissions, services, intent filters.
# Léger (pas de resources.arsc à linker).
axmldecoder = "0.5"

# Auto-update du catalogue MITRE : DL du STIX + cache local.
ureq = { version = "2", features = ["json"] }
dirs = "5"

# Signature APK : PKCS#7 (v1, META-INF/*.RSA) + X.509 des blocs v2/v3.
# Pur Rust (RustCrypto), pas de toolchain C. Les versions sont couplées :
# x509-cert 0.2 / cms 0.2 / der 0.7 partagent le même socle.
der = "0.7"
x509-cert = "0.2"
cms = "0.2"

# Empreintes de certificat (SHA-256 pivot CTI, SHA-1 et MD5 pour recoupement
# avec les bases publiques qui les exposent encore).
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"

# Décodage bytecode Dalvik (invoke-* + CFG intra-méthode). Repo Androguard,
# pas encore de release -> dépendance git.
#
# ⚠️ Déclaration SANS `branch` ni `rev` : dex-parser et dex-decompiler déclarent
# le même dépôt sans branche (GitReference::DefaultBranch). Toute autre forme
# ici donnerait un SourceId distinct, donc DEUX paquets dex-bytecode v0.0.1 dans
# le graphe, donc deux `Instruction` non interchangeables. Rev épinglé par
# Cargo.lock.
dex-bytecode = { git = "https://github.com/androguard/dex-bytecode" }

# Décompilation Java (--decompile, --bundle). Repo Androguard, Apache-2.0.
# Consommé UNIQUEMENT par parser::decompile.
dex-decompiler = { git = "https://github.com/androguard/dex-decompiler", rev = "f7fa4a4853d957ebc3c54355d128a3835ef5ae22" }

# LIEF: réservé au parsing ELF natif (lib/*/*.so). Build C++ lourd, activé à la
# demande -> `cargo build --features lief-backend`.
lief = { version = "0.16", optional = true }

[features]
default = []
lief-backend = ["dep:lief"]

[[bin]]
name = "drakkar"
path = "src/main.rs"
