[package]
name = "drakkar"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Static MITRE ATT&CK for Mobile detection on Android APKs via inter-procedural CFG"
authors = ["Sebastien Larinier"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
petgraph = { version = "0.6", features = ["serde-1"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# DEX parsing structurel (stable, crates.io) : classes -> methods -> code_item
dex = "0.5"

# Lecture de l'archive APK (zip) pour extraire classes*.dex et lib/*/*.so
zip = "2"
tempfile = "3"

# Mode bulk : parallélisme de l'analyse d'un répertoire d'APK.
rayon = "1"
# Parcours récursif optionnel du répertoire d'APK en mode bulk.
walkdir = "2"

# Décodage du manifest binaire (AXML) : permissions, services, intent filters.
# Léger (pas de resources.arsc à linker).
axmldecoder = "0.5"

# Auto-update du catalogue MITRE : DL du STIX + cache local.
ureq = { version = "2", features = ["json"] }
dirs = "5"

# Décodage bytecode Dalvik (invoke-* + CFG intra-méthode). Repo Androguard,
# pas encore de release -> dépendance git. À pinner sur un rev une fois l'API stable.
dex-bytecode = { git = "https://github.com/androguard/dex-bytecode", branch = "main" }

# LIEF: réservé au parsing ELF natif (lib/*/*.so). Build C++ lourd, activé à la
# demande -> `cargo build --features lief-backend`.
lief = { version = "0.16", optional = true }

[features]
default = []
lief-backend = ["dep:lief"]

[[bin]]
name = "drakkar"
path = "src/main.rs"
